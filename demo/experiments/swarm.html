<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Cursors</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0e10; color: #e8e8e8;
    font-family: Inter, system-ui, sans-serif; overflow: hidden; }
  .demo { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
  .demo h1 { font-size: clamp(32px, 6vw, 72px); margin: 0; letter-spacing: -0.03em; }
  .demo p { opacity: .55; margin-top: 12px; }
  .hud { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: #17181b; border: 1px solid #2a2b30; border-radius: 999px;
    padding: 6px 14px; font: 12px ui-monospace, monospace; display: flex; gap: 10px; align-items: center; z-index: 10; }
  .hud button { background: #2b6cff; color: #fff; border: 0; border-radius: 999px; padding: 4px 10px; font: inherit; cursor: pointer; }
</style>
</head>
<body>
  <div class="demo">
    <div>
      <h1>Systems that hold up.</h1>
      <p>Click anywhere to send the agents · move your mouse through them</p>
    </div>
  </div>
  <div class="hud"><span id="count"></span><button id="burst">Respawn</button></div>

<script>
/**
 * AgentSwarm — a swarm of small coloured arrow cursors that fly around in squads.
 * Usage:  const swarm = AgentSwarm({ count: 40 });   // adds a full-screen overlay canvas
 *         swarm.sendTo(x, y);  swarm.respawn();  swarm.destroy();
 */
function AgentSwarm(opts = {}) {
  const o = Object.assign({
    count: 40,
    colors: ['#ff4fa3', '#34d8ff', '#ffd23f', '#5cff8a', '#ff8a3d', '#b07cff', '#4d7cff', '#ff5555'],
    size: 11,            // cursor height in px
    trail: 4,            // ghost copies behind each cursor
    speed: 5.5,          // max speed px/frame
    squadSize: [3, 6],   // agents per squad
    parent: document.body,
  }, opts);

  const canvas = document.createElement('canvas');
  Object.assign(canvas.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 9999 });
  o.parent.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  let W, H, dpr, raf, agents = [], squads = [];
  const mouse = { x: -1e4, y: -1e4 };
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[(Math.random() * a.length) | 0];

  function newTarget(sq) {
    sq.tx = rand(W * 0.08, W * 0.92);
    sq.ty = rand(H * 0.08, H * 0.88);
    sq.state = 'fly';
    sq.workUntil = 0;
  }

  function respawn() {
    agents = []; squads = [];
    const cx = W / 2, cy = H / 2;
    let left = o.count;
    while (left > 0) {
      const n = Math.min(left, Math.round(rand(o.squadSize[0], o.squadSize[1])));
      const sq = { color: pick(o.colors) };
      newTarget(sq);
      squads.push(sq);
      for (let i = 0; i < n; i++) {
        const a = rand(0, Math.PI * 2), s = rand(2, 7);
        agents.push({
          x: cx + rand(-20, 20), y: cy + rand(-20, 20),
          vx: Math.cos(a) * s, vy: Math.sin(a) * s,
          ang: a, sq, color: Math.random() < 0.7 ? sq.color : pick(o.colors),
          off: { x: rand(-28, 28), y: rand(-18, 18) },  // slot around the squad target
          hist: [], jitter: rand(0, 100),
        });
      }
      left -= n;
    }
    countEl && (countEl.textContent = `● ${agents.length} agents · ${squads.length} squads`);
  }

  function sendTo(x, y) {
    // the nearest few squads rush to the point
    squads.slice().sort((a, b) => Math.hypot(a.tx - x, a.ty - y) - Math.hypot(b.tx - x, b.ty - y))
      .slice(0, 3).forEach(sq => { sq.tx = x + rand(-40, 40); sq.ty = y + rand(-30, 30); sq.state = 'fly'; });
  }

  // classic pointer arrow, tip at (0,0) pointing "up-left" like a real cursor
  function arrowPath(s) {
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(0, s);
    ctx.lineTo(s * 0.28, s * 0.74);
    ctx.lineTo(s * 0.5, s * 1.1);
    ctx.lineTo(s * 0.64, s * 1.03);
    ctx.lineTo(s * 0.43, s * 0.68);
    ctx.lineTo(s * 0.75, s * 0.68);
    ctx.closePath();
  }

  function drawCursor(x, y, ang, color, alpha) {
    ctx.save();
    ctx.translate(x, y);
    // the arrow body extends ~1.16 rad from its tip; rotate so the tip leads the heading
    ctx.rotate(ang - Math.PI - 1.16);
    ctx.globalAlpha = alpha;
    arrowPath(o.size);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(0,0,0,.6)';
    ctx.stroke();
    ctx.restore();
  }

  function step(t) {
    // squads: fly → work (hover at target) → pick new target
    for (const sq of squads) {
      if (sq.state === 'work' && t > sq.workUntil) newTarget(sq);
    }

    for (const a of agents) {
      const sq = a.sq;
      let tx = sq.tx + a.off.x, ty = sq.ty + a.off.y;
      const dx = tx - a.x, dy = ty - a.y, d = Math.hypot(dx, dy);

      if (sq.state === 'work') {
        // small "busy" wiggle while working on a spot
        tx += Math.sin(t / 180 + a.jitter) * 6;
        ty += Math.cos(t / 230 + a.jitter) * 4;
      }
      // steer toward slot (arrive behaviour)
      const max = o.speed * (sq.state === 'work' ? 0.35 : 1);
      const want = Math.min(max, d / 12);
      const ddx = tx - a.x, ddy = ty - a.y, dd = Math.hypot(ddx, ddy) || 1;
      a.vx += ((ddx / dd) * want - a.vx) * 0.08;
      a.vy += ((ddy / dd) * want - a.vy) * 0.08;

      // separation from neighbours
      for (const b of agents) {
        if (b === a) continue;
        const sx = a.x - b.x, sy = a.y - b.y, s2 = sx * sx + sy * sy;
        if (s2 < 196 && s2 > 0.01) { const s = Math.sqrt(s2), f = (14 - s) / 14 * 0.5; a.vx += sx / s * f; a.vy += sy / s * f; }
      }
      // flee the mouse
      const mx = a.x - mouse.x, my = a.y - mouse.y, m2 = mx * mx + my * my;
      if (m2 < 90 * 90) { const f = (1 - Math.sqrt(m2) / 90) * 1.6; const m = Math.sqrt(m2) || 1; a.vx += mx / m * f; a.vy += my / m * f; }

      let sp = Math.hypot(a.vx, a.vy);
      const cap = o.speed * 1.8;
      if (sp > cap) { a.vx *= cap / sp; a.vy *= cap / sp; sp = cap; }
      a.x += a.vx; a.y += a.vy;
      if (sp > 0.4) {
        // smooth heading toward velocity
        let target = Math.atan2(a.vy, a.vx), diff = target - a.ang;
        diff = Math.atan2(Math.sin(diff), Math.cos(diff));
        a.ang += diff * 0.2;
      }
      a.hist.unshift({ x: a.x, y: a.y, ang: a.ang });
      if (a.hist.length > o.trail * 3 + 1) a.hist.pop();
    }

    // squad arrives when most members are close
    for (const sq of squads) {
      if (sq.state !== 'fly') continue;
      const mem = agents.filter(a => a.sq === sq);
      const near = mem.filter(a => Math.hypot(sq.tx + a.off.x - a.x, sq.ty + a.off.y - a.y) < 20).length;
      if (near >= mem.length * 0.7) { sq.state = 'work'; sq.workUntil = t + rand(900, 2600); }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    for (const a of agents) {
      const sp = Math.hypot(a.vx, a.vy);
      // ghost echoes, only visible while moving fast
      if (sp > 1.5) {
        for (let i = o.trail; i >= 1; i--) {
          const h = a.hist[i * 3]; if (!h) continue;
          drawCursor(h.x, h.y, h.ang, a.color, 0.35 * (1 - i / (o.trail + 1)) * Math.min(1, sp / 5));
        }
      }
      drawCursor(a.x, a.y, a.ang, a.color, 1);
    }
  }

  function loop(t) { step(t); draw(); raf = requestAnimationFrame(loop); }

  const onMove = e => { mouse.x = e.clientX; mouse.y = e.clientY; };
  const onLeave = () => { mouse.x = mouse.y = -1e4; };
  addEventListener('resize', resize);
  addEventListener('pointermove', onMove);
  addEventListener('pointerleave', onLeave);

  const countEl = opts.countEl || null;
  resize(); respawn();
  if (reduced) { step(0); draw(); } else raf = requestAnimationFrame(loop);

  return {
    sendTo, respawn,
    destroy() { cancelAnimationFrame(raf); canvas.remove();
      removeEventListener('resize', resize); removeEventListener('pointermove', onMove); removeEventListener('pointerleave', onLeave); },
  };
}

// ---- demo ----
const swarm = AgentSwarm({ count: 40, countEl: document.getElementById('count') });
addEventListener('click', e => { if (!e.target.closest('.hud')) swarm.sendTo(e.clientX, e.clientY); });
document.getElementById('burst').onclick = () => swarm.respawn();
</script>
</body>
</html>
