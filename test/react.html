<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>React test</title>
<script type="importmap">
{ "imports": {
  "react": "https://esm.sh/react@18.3.1",
  "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
} }
</script>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #0b0b0f; color: #eee; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .card { background: #16161c; border: 1px solid #26262e; border-radius: 12px; padding: 18px; }
  button { background: #6366f1; color: #fff; border: 0; border-radius: 8px; padding: 10px 16px; font: inherit; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
  import { createElement as h, StrictMode, useState } from 'react';
  import { createRoot } from 'react-dom/client';
  import { AgentBuild } from '../react.mjs';

  function App() {
    const [n, setN] = useState(0);
    return h('div', { className: 'wrap' },
      h('h1', null, 'React + agent-build'),
      h('p', null, 'This page is rendered by React 18 in StrictMode (effects run twice on mount).'),
      h('button', { onClick: () => setN(n + 1) }, `State still works: clicked ${n}`),
      h('div', { className: 'grid', style: { marginTop: 20 } },
        ['Components', 'Hooks', 'Server'].map(t => h('div', { key: t, className: 'card' }, h('h3', null, t), h('p', null, `${t} keep working while agents build.`)))));
  }

  window.__events = [];
  createRoot(document.getElementById('root')).render(
    h(StrictMode, null,
      h(AgentBuild, { agents: 6, hud: true, duration: 8, onDone: d => { window.__events.push(d); window.__done = d; } }, h(App))));
</script>
</body>
</html>
